services:
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: what-to-eat-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////data/what_to_eat.db"
      EVIDENCE_DIR: "/data/evidence"
      FRONTEND_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - backend_data:/data
    networks:
      - what-to-eat-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: what-to-eat-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_DEV_BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
    networks:
      - what-to-eat-net
    restart: unless-stopped

volumes:
  backend_data:

networks:
  what-to-eat-net:
    driver: bridge
